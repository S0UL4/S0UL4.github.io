<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="pTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1100" height="760" fill="#ffffff"/>

  <!-- sandbox -->
  <text x="45" y="26" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">CONTAINER-AS-A-SERVICE</text>
  <rect x="40" y="38" width="400" height="165" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="58" y="56" width="364" height="129" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <g stroke="#4f46e5" stroke-width="2.2" fill="none" stroke-linecap="round">
    <rect x="88" y="100" width="34" height="34" rx="6"/>
    <rect x="97" y="109" width="16" height="16" rx="2.5"/>
    <path d="M97,100 v-6 M105,100 v-6 M113,100 v-6 M97,134 v6 M105,134 v6 M113,134 v6 M88,109 h-6 M88,117 h-6 M88,125 h-6 M122,109 h6 M122,117 h6 M122,125 h6"/>
  </g>
  <text x="150" y="112" font-size="24" font-weight="700" fill="#1e1b4b">OpenAI sandbox</text>
  <text x="150" y="140" font-size="15" fill="#475569">the agent · no internet</text>

  <!-- artifactory -->
  <rect x="650" y="38" width="400" height="165" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <g stroke="#d97706" stroke-width="2.4" fill="none" stroke-linejoin="round">
    <path d="M700,80 L723,92 L700,104 L677,92 Z"/>
    <path d="M677,92 V119 L700,131 L723,119 V92"/>
    <path d="M700,104 V131"/>
  </g>
  <text x="748" y="100" font-size="24" font-weight="700" fill="#7c2d12">Artifactory</text>
  <text x="748" y="128" font-size="15" fill="#475569">has internet</text>
  <text x="678" y="172" font-size="15" font-weight="700" fill="#d97706">also: the message board</text>

  <!-- SSRF -->
  <line x1="444" y1="120" x2="643" y2="120" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pIndigo)"/>
  <text x="543" y="105" text-anchor="middle" font-size="15" fill="#334155">SSRF</text>

  <!-- diagonals -->
  <line x1="642" y1="208" x2="452" y2="472" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pIndigo)"/>
  <circle cx="512" cy="300" r="18" fill="#4f46e5"/><text x="512" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="490" y="345" text-anchor="end" font-size="15" fill="#334155">public read</text>
  <line x1="500" y1="478" x2="678" y2="212" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#pTeal)"/>
  <text x="575" y="410" font-size="16" font-weight="700" fill="#0d9488">14 write tokens</text>

  <!-- artifactory -> modal -->
  <line x1="850" y1="205" x2="850" y2="524" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pIndigo)"/>
  <text x="828" y="452" text-anchor="end" font-size="15" fill="#334155">command injection</text>
  <text x="828" y="477" text-anchor="end" font-size="15" fill="#334155">→ root</text>

  <!-- hugging face -->
  <rect x="40" y="490" width="400" height="220" rx="14" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="100" cy="545" r="21" fill="#fbbf24"/>
  <circle cx="92" cy="540" r="3" fill="#78350f"/><circle cx="108" cy="540" r="3" fill="#78350f"/>
  <path d="M89,551 q11,10 22,0" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="545" font-size="25" font-weight="700" fill="#0f172a">Hugging Face</text>
  <text x="140" y="574" font-size="15" fill="#475569">41 dataset workers</text>
  <circle cx="78" cy="640" r="17" fill="#dc2626"/><text x="78" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="105" y="646" font-size="17" font-weight="700" fill="#0f172a">HDF5 → file read</text>
  <rect x="330" y="627" width="82" height="26" rx="13" fill="#fee2e2"/>
  <text x="371" y="645" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1">0-DAY</text>

  <!-- modal -->
  <rect x="650" y="530" width="400" height="180" rx="14" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <g fill="#22c55e">
    <path d="M676,608 L692,572 L706,572 L690,608 Z"/>
    <path d="M700,608 L716,572 L730,572 L714,608 Z"/>
  </g>
  <text x="748" y="590" font-size="24" font-weight="700" fill="#0f172a">Modal sandbox</text>
  <text x="748" y="618" font-size="15" fill="#475569">someone else's · root</text>
  <text x="678" y="662" font-size="15" fill="#475569">real internet · clean IP</text>

  <!-- modal -> hf -->
  <line x1="645" y1="612" x2="448" y2="612" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#pIndigo)"/>
  <text x="546" y="570" text-anchor="middle" font-size="15" fill="#334155">stolen tokens</text>
  <text x="546" y="593" text-anchor="middle" font-size="15" fill="#334155">upload dataset</text>
</svg>
