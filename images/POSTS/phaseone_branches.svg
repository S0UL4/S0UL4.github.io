<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="bIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="bRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
    <g id="tick" stroke="#0d9488" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,0 l6,7 l12,-16"/></g>
    <g id="cross" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M-7,-7 L7,7 M7,-7 L-7,7"/></g>
  </defs>
  <rect width="1100" height="770" fill="#ffffff"/>

  <!-- header -->
  <rect x="390" y="25" width="320" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="550" y="70" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#7c2d12">PHASEONE[big]</text>
  <text x="550" y="133" text-anchor="middle" font-size="21" font-style="italic" font-weight="700" fill="#d97706">“We should build a way to delegate, not own everything”</text>
  <text x="550" y="162" text-anchor="middle" font-size="15" fill="#64748b">hundreds of assignments · ~20% of everything on the board that day</text>

  <!-- branches -->
  <path d="M550,185 V215 M200,215 H900 M200,215 V262 M550,215 V262 M900,215 V262" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <path d="M200,240 V262" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#bIndigo)"/>
  <path d="M550,240 V262" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#bIndigo)"/>
  <path d="M900,240 V262" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#bIndigo)"/>

  <!-- card 1 -->
  <rect x="50" y="275" width="300" height="205" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="85" cy="316" r="16" fill="#4f46e5"/><text x="85" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="312" font-size="18" font-weight="700" fill="#0f172a">REPLACE</text>
  <text x="112" y="334" font-size="18" font-weight="700" fill="#0f172a">THE TARGET</text>
  <rect x="78" y="350" width="82" height="26" rx="13" fill="#fee2e2"/>
  <text x="119" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1">0-DAY</text>
  <line x1="78" y1="395" x2="322" y2="395" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="78" y="428" font-size="15" fill="#334155">fake a capture</text><use href="#tick" x="305" y="423"/>
  <text x="78" y="460" font-size="15" fill="#334155">erase the past</text><use href="#cross" x="305" y="455"/>

  <!-- card 2 -->
  <rect x="400" y="275" width="300" height="205" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="435" cy="316" r="16" fill="#4f46e5"/><text x="435" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="462" y="312" font-size="18" font-weight="700" fill="#0f172a">TAMPER</text>
  <text x="462" y="334" font-size="18" font-weight="700" fill="#0f172a">THE LOGS</text>
  <line x1="428" y1="395" x2="672" y2="395" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="428" y="428" font-size="15" fill="#334155">fake a capture</text><use href="#tick" x="655" y="423"/>
  <text x="428" y="460" font-size="15" fill="#334155">erase the past</text><use href="#cross" x="655" y="455"/>

  <!-- card 3 -->
  <rect x="750" y="275" width="300" height="205" rx="12" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="785" cy="316" r="16" fill="#dc2626"/><text x="785" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="812" y="312" font-size="18" font-weight="700" fill="#0f172a">TAMPER</text>
  <text x="812" y="334" font-size="18" font-weight="700" fill="#0f172a">THE GRADER</text>
  <line x1="778" y1="395" x2="1022" y2="395" stroke="#fecaca" stroke-width="1.5"/>
  <text x="778" y="428" font-size="15" fill="#334155">fake a capture</text><use href="#tick" x="1005" y="423"/>
  <text x="778" y="460" font-size="15" font-weight="700" fill="#0f172a">erase the past</text><use href="#tick" x="1005" y="455"/>

  <!-- verdict -->
  <text x="550" y="540" text-anchor="middle" font-size="22" font-weight="700" fill="#d97706">Only the third solved both problems</text>
  <path d="M900,560 V604" stroke="#ef4444" stroke-width="2.5" marker-end="url(#bRed)"/>

  <!-- outcome -->
  <rect x="230" y="615" width="670" height="120" rx="14" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <text x="268" y="668" font-size="22" font-weight="700" fill="#0f172a">…but they had never seen the grader</text>
  <text x="268" y="700" font-size="16" fill="#475569">so they went hunting for it — and that hunt walked them into Hugging Face</text>
</svg>
