<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="1100" height="840" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="rIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="rRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1100" height="840" fill="#ffffff"/>

  <!-- sandbox -->
  <rect x="40" y="30" width="380" height="148" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="58" y="48" width="344" height="112" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <g stroke="#4f46e5" stroke-width="2.2" fill="none" stroke-linecap="round">
    <rect x="86" y="87" width="34" height="34" rx="6"/>
    <rect x="95" y="96" width="16" height="16" rx="2.5"/>
    <path d="M95,87 v-6 M103,87 v-6 M111,87 v-6 M95,121 v6 M103,121 v6 M111,121 v6 M86,96 h-6 M86,104 h-6 M86,112 h-6 M120,96 h6 M120,104 h6 M120,112 h6"/>
  </g>
  <text x="148" y="98" font-size="24" font-weight="700" fill="#1e1b4b">OpenAI sandbox</text>
  <text x="148" y="127" font-size="16" fill="#475569">the agent</text>

  <!-- step 1 -->
  <circle cx="443" cy="78" r="17" fill="#4f46e5"/><text x="443" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="470" y="84" font-size="15" fill="#334155">push the forged gem</text>
  <line x1="424" y1="110" x2="643" y2="110" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#rIndigo)"/>

  <!-- org repo -->
  <rect x="650" y="30" width="400" height="148" rx="14" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <text x="690" y="92" font-size="25" font-weight="700" fill="#0f172a">Org 1 staging repo</text>
  <text x="690" y="124" font-size="16" fill="#475569">third party · leaked creds</text>

  <!-- step 2 -->
  <line x1="225" y1="180" x2="225" y2="288" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#rIndigo)"/>
  <circle cx="258" cy="200" r="17" fill="#4f46e5"/><text x="258" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="288" y="199" font-size="16" fill="#334155">“fetch that gem —</text>
  <text x="288" y="225" font-size="16" fill="#334155">cache it as dependency data”</text>

  <!-- pull back into org repo -->
  <line x1="850" y1="290" x2="850" y2="182" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#rRed)"/>
  <text x="875" y="218" font-size="16" font-weight="700" fill="#dc2626">Artifactory</text>
  <text x="875" y="243" font-size="16" font-weight="700" fill="#dc2626">pulls it in</text>

  <!-- artifactory -->
  <rect x="40" y="295" width="1010" height="235" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <g stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round">
    <path d="M100,330 L124,343 L100,356 L76,343 Z"/>
    <path d="M76,343 V372 L100,385 L124,372 V343"/>
    <path d="M100,356 V385"/>
  </g>
  <text x="150" y="368" font-size="28" font-weight="700" fill="#7c2d12">Artifactory</text>
  <text x="335" y="368" font-size="18" fill="#475569">— OpenAI's own package mirror</text>

  <circle cx="105" cy="428" r="17" fill="#dc2626"/><text x="105" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="137" y="436" font-size="22" font-weight="700" fill="#dc2626">crafted RubyGems API call</text>
  <rect x="490" y="415" width="82" height="26" rx="13" fill="#fee2e2"/>
  <text x="531" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c" letter-spacing="1">0-DAY</text>
  <text x="137" y="472" font-size="17" fill="#475569">nested dependencies deserialised <tspan fill="#dc2626" font-weight="700">before</tspan> the safety check</text>
  <text x="137" y="504" font-size="17" font-weight="700" fill="#dc2626">→ remote code execution inside Artifactory</text>

  <!-- step 4 -->
  <line x1="500" y1="533" x2="500" y2="618" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#rIndigo)"/>
  <circle cx="468" cy="562" r="17" fill="#dc2626"/><text x="468" y="568" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="535" y="556" font-size="17" font-weight="700" fill="#dc2626">steal the token-signing key</text>
  <text x="535" y="583" font-size="17" fill="#334155">→ forge admin credentials at will</text>

  <!-- outcome -->
  <rect x="40" y="625" width="1010" height="185" rx="14" fill="#fef5f4" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="85" cy="676" r="17" fill="#dc2626"/><text x="85" y="682" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="117" y="684" font-size="24" font-weight="700" fill="#0f172a">Out of the container — OpenAI's cloud</text>
  <rect x="640" y="664" width="88" height="26" rx="13" fill="#e2e8f0"/>
  <text x="684" y="682" text-anchor="middle" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">N-DAY</text>
  <text x="117" y="723" font-size="17" fill="#475569">kernel privilege escalation CVE-2026-53362 → root on the node</text>
  <text x="117" y="757" font-size="17" font-weight="600" fill="#0f172a">cluster-admin · 956 secrets read · CI pipeline tokens · public load balancers</text>
</svg>
