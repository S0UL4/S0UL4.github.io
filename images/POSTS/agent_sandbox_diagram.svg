<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1100 450" width="1100" height="450" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <rect x="0" y="40" width="1100" height="450" fill="#ffffff"/>

  <!-- Blocked direct path -->
  <path d="M190,200 V115 H925 V226" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#aRed)"/>
  <circle cx="555" cy="115" r="17" fill="#ffffff" stroke="#ef4444" stroke-width="3"/>
  <line x1="543" y1="127" x2="567" y2="103" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <text x="555" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">direct internet access blocked</text>

  <!-- Sandbox -->
  <rect x="40" y="200" width="300" height="265" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="190" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">SANDBOXED CONTAINER (CaaS)</text>
  <rect x="65" y="245" width="250" height="195" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <g stroke="#4f46e5" stroke-width="2.5" fill="none" stroke-linecap="round">
    <rect x="165" y="270" width="50" height="50" rx="8"/>
    <rect x="178" y="283" width="24" height="24" rx="3"/>
    <path d="M178,270 v-8 M190,270 v-8 M202,270 v-8 M178,320 v8 M190,320 v8 M202,320 v8 M165,283 h-8 M165,295 h-8 M165,307 h-8 M215,283 h8 M215,295 h8 M215,307 h8"/>
  </g>
  <text x="190" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#1e1b4b">AI Agent</text>
  <text x="190" y="395" text-anchor="middle" font-size="14" fill="#475569">shell + python</text>
  <text x="190" y="416" text-anchor="middle" font-size="14" fill="#475569">network disabled</text>

  <!-- Arrow 1 -->
  <line x1="342" y1="330" x2="420" y2="330" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="381" y="316" text-anchor="middle" font-size="14" fill="#334155">pip install</text>

  <!-- Artifactory -->
  <rect x="425" y="230" width="260" height="210" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <g stroke="#d97706" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <path d="M555,268 L582,282 L555,296 L528,282 Z"/>
    <path d="M528,282 V312 L555,326 L582,312 V282"/>
    <path d="M555,296 V326"/>
  </g>
  <text x="555" y="365" text-anchor="middle" font-size="24" font-weight="700" fill="#7c2d12">Artifactory</text>
  <text x="555" y="390" text-anchor="middle" font-size="14" fill="#475569">shared package mirror</text>
  <rect x="445" y="402" width="220" height="26" rx="13" fill="#fde68a"/>
  <text x="555" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">no isolation between agents</text>

  <!-- Arrow 2 -->
  <line x1="687" y1="330" x2="785" y2="330" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="736" y="316" text-anchor="middle" font-size="14" fill="#334155">fetches it</text>

  <!-- Internet -->
  <rect x="790" y="230" width="270" height="210" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <path d="M903,318 H950 A15,15 0 0 0 950,288 A22,22 0 0 0 908,282 A18,18 0 0 0 903,318 Z" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="925" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">Internet</text>
  <text x="925" y="393" text-anchor="middle" font-size="14" fill="#475569">public packages</text>
</svg>
