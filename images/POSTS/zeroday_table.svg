<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="800" fill="#ffffff"/>

  <!-- header -->
  <text x="40" y="70" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2.5">WHEN</text>
  <text x="150" y="70" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2.5">TARGET</text>
  <text x="345" y="70" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2.5">THE FLAW</text>
  <text x="800" y="60" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2.5">WHAT IT GAVE</text>
  <text x="800" y="80" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2.5">THEM</text>
  <line x1="40" y1="100" x2="1060" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- row 1 -->
  <text x="40" y="155" font-size="19" font-weight="700" fill="#d97706">Jun 26</text>
  <rect x="150" y="136" width="130" height="28" rx="14" fill="#fef3c7"/>
  <text x="215" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Artifactory</text>
  <text x="345" y="157" font-size="22" font-weight="700" fill="#0f172a">Token-refresh logic</text>
  <text x="345" y="190" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">invalid signature in → valid</text>
  <text x="345" y="214" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">admin token out</text>
  <text x="800" y="152" font-size="17" fill="#334155">admin, then</text>
  <text x="800" y="182" font-size="17" fill="#334155">persistent RCE</text>
  <line x1="40" y1="245" x2="1060" y2="245" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- row 2 -->
  <text x="40" y="295" font-size="19" font-weight="700" fill="#d97706">Jul 9</text>
  <rect x="150" y="276" width="130" height="28" rx="14" fill="#fef3c7"/>
  <text x="215" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Artifactory</text>
  <text x="345" y="297" font-size="22" font-weight="700" fill="#0f172a">Container image cache poisoning</text>
  <text x="345" y="330" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">CVE-2026-66384</text>
  <text x="800" y="292" font-size="17" fill="#334155">poisoned a trusted</text>
  <text x="800" y="322" font-size="17" fill="#334155">image</text>
  <text x="800" y="352" font-size="17" fill="#334155">(never pulled)</text>
  <line x1="40" y1="380" x2="1060" y2="380" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- row 3 -->
  <text x="40" y="432" font-size="19" font-weight="700" fill="#d97706">Jul 11</text>
  <rect x="150" y="413" width="150" height="28" rx="14" fill="#fee2e2"/>
  <text x="225" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Hugging Face</text>
  <text x="345" y="434" font-size="22" font-weight="700" fill="#0f172a">HDF5 external storage</text>
  <text x="345" y="467" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">→ arbitrary file read</text>
  <text x="800" y="429" font-size="17" fill="#334155">production</text>
  <text x="800" y="459" font-size="17" fill="#334155">credentials</text>
  <text x="800" y="489" font-size="17" fill="#334155">+ their source code</text>
  <line x1="40" y1="515" x2="1060" y2="515" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- row 4 -->
  <text x="40" y="567" font-size="19" font-weight="700" fill="#d97706">Jul 11</text>
  <rect x="150" y="548" width="150" height="28" rx="14" fill="#fee2e2"/>
  <text x="225" y="567" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Hugging Face</text>
  <text x="345" y="569" font-size="22" font-weight="700" fill="#0f172a">ReferenceFileSystem → Jinja2</text>
  <text x="345" y="602" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">→ remote code execution</text>
  <text x="800" y="564" font-size="17" fill="#334155">41 workers →</text>
  <text x="800" y="594" font-size="17" fill="#334155">cluster admin</text>
  <line x1="40" y1="630" x2="1060" y2="630" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- row 5 -->
  <text x="40" y="682" font-size="19" font-weight="700" fill="#d97706">Jul 13</text>
  <rect x="150" y="663" width="130" height="28" rx="14" fill="#fef3c7"/>
  <text x="215" y="682" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Artifactory</text>
  <text x="345" y="684" font-size="22" font-weight="700" fill="#0f172a">JRuby / RubyGems</text>
  <text x="345" y="714" font-size="22" font-weight="700" fill="#0f172a">deserialization</text>
  <text x="345" y="750" font-family="'DejaVu Sans Mono', monospace" font-size="16" fill="#64748b">→ remote code execution</text>
  <text x="800" y="679" font-size="17" fill="#334155">signing key → forge</text>
  <text x="800" y="709" font-size="17" fill="#334155">admin</text>
  <text x="800" y="739" font-size="17" fill="#334155">credentials at will</text>
</svg>
